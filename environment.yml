name: defor-hotspots
channels:
  - conda-forge
dependencies:
  - python=3.12
  - geopandas
  - shapely
  - pyproj
  - pyogrio
  - rasterio
  - numpy
  - pandas
  - scipy
  - matplotlib
  - libpysal
  - esda
  - jupyterlab
  - pytest
  - pip
  - pip:
      - "mcp>=1.20"
# gis-mcp 0.15 pins numpy<2 and rasterio 1.3.9, so it is installed apart:
#   uv tool install --python 3.12 gis-mcp==0.15.0
